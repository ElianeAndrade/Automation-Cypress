# pipeline-manual.yml
trigger: none
pr: none

parameters:
  - name: ambiente
    displayName: "Escolha o ambiente"
    type: string
    default: "STG"
    values:
      - STG
      - PRD

  - name: cenario
    displayName: "Qual cenário deseja rodar?"
    type: string
    default: "login.cy.js"
    values:
      - grupo-monitoramento-1
      - grupo-monitoramento-2
      - grupo-monitoramento-3
      - grupo-monitoramento-4
      - login.cy.js
      - cadastro.cy.js
      - homeNome_Instituição.cy.js
      - homeNome_InstituiçãoCIA.cy.js
      - telaATS.cy.js
      - footerEmpresas.cy.js
      - footerInstitucional.cy.js
      - pesquisarCurriculoNome_Instituição.cy.js
      - siteTrabalheConosco.cy.js
      - meusCurriculos.cy.js
      - configuracoes.cy.js
      - planos.cy.js

pool:
  vmImage: 'ubuntu-latest'

steps:
  - script: |
      export TERM=xterm
      echo "=== Rodando: ${{ parameters.cenario }} | Ambiente: ${{ parameters.ambiente }} ==="

      cd Nome_Instituição_cypress
      npm install
      mkdir -p cypress/reports

      if [ "${{ parameters.cenario }}" = "grupo-monitoramento-1" ]; then
        SPEC="cypress/e2e/pesquisarCurriculoNome_Instituição.cy.js"

      elif [ "${{ parameters.cenario }}" = "grupo-monitoramento-2" ]; then
        SPEC="cypress/e2e/footerEmpresas.cy.js,cypress/e2e/siteTrabalheConosco.cy.js,cypress/e2e/login.cy.js"

      elif [ "${{ parameters.cenario }}" = "grupo-monitoramento-3" ]; then
        SPEC="cypress/e2e/cadastro.cy.js,cypress/e2e/configuracoes.cy.js,cypress/e2e/planos.cy.js"

      elif [ "${{ parameters.cenario }}" = "grupo-monitoramento-4" ]; then
        SPEC="cypress/e2e/homeNome_Instituição.cy.js,cypress/e2e/homeNome_InstituiçãoCIA.cy.js,cypress/e2e/meusCurriculos.cy.js,cypress/e2e/telaATS.cy.js"

      else
        SPEC="cypress/e2e/${{ parameters.cenario }}"
      fi

      echo "📂 Executando: $SPEC"

      npx cypress run \
        --spec "$SPEC" \
        --env ENV=${{ parameters.ambiente }} \
        --browser electron \
        || echo "⚠️ Testes falharam, mas pipeline continua"

    displayName: "Executar Cypress (Manual)"
    continueOnError: "true"

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: 'Nome_Instituição_cypress/cypress/reports'
      ArtifactName: 'CypressReport'
      publishLocation: 'Container'